
name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Web App
        run: |
          test -f www/index.html
          echo "Web application found in www"

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Configure Info.plist Permissions
        run: |
          PLIST="ios/App/App/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Camera access is required to capture photos.'" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryAddUsageDescription string 'Photo library access is required to save captured photos.'" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'Photo library access is required to select photos.'" \
            "$PLIST" 2>/dev/null || true

      - name: Build Unsigned App
        run: |
          set -o pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify Built App
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package App into IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/App.app

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload PMO-WLB-Camera.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMO-WLB-Camera-IPA
          path: PMO-WLB-Camera.ipa
