<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PMO-WLB Camera</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(39, 39, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-button:active {
            transform: scale(0.94);
            background: rgba(63, 63, 70, 0.9);
        }
        .color-btn.active-color {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 0 12px rgba(251, 191, 36, 0.6);
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-[100dvh] w-screen overflow-hidden antialiased">

    <!-- Header Controls -->
    <header class="relative z-20 flex items-center justify-between p-4 px-6 glass-panel shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-xs font-semibold uppercase tracking-widest text-zinc-300">PMO-WLB Cam</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="styleSettingsBtn" class="glass-button p-2.5 rounded-full text-zinc-200">
                <i data-lucide="sliders" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Capture Screen -->
    <main class="relative flex-1 w-full h-full bg-zinc-900 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm rounded-3xl p-6 glass-panel flex flex-col items-center text-center gap-6 shadow-2xl">
            <div class="w-20 h-20 rounded-full bg-amber-400/10 border-2 border-amber-400/30 flex items-center justify-center text-amber-400">
                <i data-lucide="camera" class="w-10 h-10"></i>
            </div>
            
            <div>
                <h2 class="text-xl font-bold text-white">Capture & Stamp Photo</h2>
                <p class="text-xs text-zinc-400 mt-1">Tap below to open native device camera, apply custom watermark badge, and auto-save directly to Photos.</p>
            </div>

            <!-- Preview Card -->
            <div class="w-full p-4 bg-black/60 rounded-2xl border border-white/10 text-left space-y-1">
                <div class="text-[10px] uppercase font-bold text-zinc-500">Live Badge Preview</div>
                <div class="inline-flex flex-col items-center justify-center text-center px-3 py-1.5 rounded-xl bg-black/80 border border-white/20 mt-1">
                    <span id="badgeTag" class="font-extrabold uppercase tracking-wider text-amber-400 text-sm">PMO-WLB</span>
                    <span id="badgeCategory" class="font-bold text-zinc-200 tracking-wide text-xs">BIOMETRIC</span>
                    <span id="badgeTimestamp" class="font-medium text-zinc-300 text-[10px]">2026-10-06 16:55:00</span>
                </div>
            </div>

            <button id="nativeCaptureBtn" class="w-full py-4 bg-amber-400 hover:bg-amber-300 text-zinc-950 font-extrabold rounded-2xl shadow-lg active:scale-95 transition-all text-base flex items-center justify-center gap-2">
                <i data-lucide="aperture" class="w-5 h-5"></i>
                Take Photo
            </button>
        </div>
    </main>

    <!-- Watermark Settings Drawer -->
    <div id="settingsDrawer" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none flex flex-col justify-end">
        <div class="bg-zinc-900 border-t border-zinc-800 rounded-t-3xl p-6 transition-transform duration-300 transform translate-y-full flex flex-col gap-4 max-w-lg mx-auto w-full max-h-[85dvh] overflow-y-auto" id="drawerContent">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-amber-400"></i>
                    Watermark Settings
                </h3>
                <button id="closeSettingsBtn" class="p-2 rounded-full text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Stamp Text</label>
                <input type="text" id="stampTextInput" value="PMO-WLB" class="w-full px-4 py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-white font-semibold focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Sub-Category</label>
                <select id="categorySelect" class="w-full px-4 py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-amber-400 font-bold focus:outline-none focus:border-amber-400">
                    <option value="BIOMETRIC">BIOMETRIC</option>
                    <option value="RECORDS TS">RECORDS TS</option>
                    <option value="FIN DIS TS">FIN DIS TS</option>
                    <option value="FIN COLL TS">FIN COLL TS</option>
                    <option value="HARBOUR TS">HARBOUR TS</option>
                    <option value="HARBOUR ENC. TS">HARBOUR ENC. TS</option>
                </select>
            </div>

            <button id="applySettingsBtn" class="w-full mt-2 py-3 bg-amber-400 text-zinc-950 font-bold rounded-xl active:scale-98">
                Save Preferences
            </button>
        </div>
    </div>

    <!-- Photo Preview Modal -->
    <div id="previewModal" class="fixed inset-0 z-50 bg-black flex flex-col hidden">
        <div class="relative z-20 flex items-center justify-between p-4 px-6 glass-panel shrink-0">
            <button id="retakeBtn" class="flex items-center gap-1.5 text-zinc-300 text-sm font-medium glass-button px-3.5 py-2 rounded-xl">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back
            </button>
            <span id="saveStatusText" class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Saved to Photos</span>
            <div class="w-12"></div>
        </div>
        <div class="flex-1 w-full flex flex-col items-center justify-center p-4 bg-zinc-950 overflow-hidden">
            <img id="stampedImageResult" class="max-w-full max-h-[75dvh] object-contain rounded-2xl shadow-2xl border border-zinc-800" alt="Stamped Capture">
        </div>
    </div>

    <canvas id="photoCanvas" class="hidden"></canvas>

    <script>
        let stampText = 'PMO-WLB';
        let categoryText = 'BIOMETRIC';

        const nativeCaptureBtn = document.getElementById('nativeCaptureBtn');
        const badgeTag = document.getElementById('badgeTag');
        const badgeCategory = document.getElementById('badgeCategory');
        const badgeTimestamp = document.getElementById('badgeTimestamp');
        
        const styleSettingsBtn = document.getElementById('styleSettingsBtn');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const drawerContent = document.getElementById('drawerContent');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const applySettingsBtn = document.getElementById('applySettingsBtn');
        const stampTextInput = document.getElementById('stampTextInput');
        const categorySelect = document.getElementById('categorySelect');

        const previewModal = document.getElementById('previewModal');
        const stampedImageResult = document.getElementById('stampedImageResult');
        const retakeBtn = document.getElementById('retakeBtn');
        const saveStatusText = document.getElementById('saveStatusText');
        const photoCanvas = document.getElementById('photoCanvas');

        function getFormattedTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        setInterval(() => {
            if (badgeTimestamp) badgeTimestamp.textContent = getFormattedTimestamp();
        }, 1000);

        function updateUI() {
            badgeTag.textContent = stampText;
            badgeCategory.textContent = categoryText;
        }

        async function takePhotoNative() {
            try {
                // Access native Capacitor Camera plugin
                const Camera = window.Capacitor?.Plugins?.Camera;
                
                if (!Camera) {
                    alert('Capacitor Camera Plugin is not loaded. Ensure @capacitor/camera is installed.');
                    return;
                }

                const photo = await Camera.getPhoto({
                    quality: 90,
                    allowEditing: false,
                    resultType: 'dataUrl',
                    source: 'CAMERA'
                });

                if (photo && photo.dataUrl) {
                    await applyStampAndSave(photo.dataUrl);
                }
            } catch (err) {
                console.error("Camera Error: ", err);
            }
        }

        async function applyStampAndSave(dataUrl) {
            const img = new Image();
            img.onload = async () => {
                photoCanvas.width = img.width;
                photoCanvas.height = img.height;

                const ctx = photoCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                // Draw Badge
                const timestampStr = getFormattedTimestamp();
                const scaleFactor = Math.min(img.width, img.height) / 600;
                
                const calcStampSize = Math.max(18 * scaleFactor, 18);
                const calcCatSize = Math.max(14 * scaleFactor, 14);
                const calcDateSize = Math.max(12 * scaleFactor, 12);

                const paddingX = 18 * scaleFactor;
                const paddingY = 12 * scaleFactor;
                const margin = 28 * scaleFactor;

                ctx.font = `800 ${calcStampSize}px Inter, sans-serif`;
                const textWidth = ctx.measureText(stampText).width;
                
                ctx.font = `700 ${calcCatSize}px Inter, sans-serif`;
                const catWidth = ctx.measureText(categoryText).width;

                ctx.font = `500 ${calcDateSize}px Inter, sans-serif`;
                const subTextWidth = ctx.measureText(timestampStr).width;

                const maxContentWidth = Math.max(textWidth, catWidth, subTextWidth);
                const cardWidth = maxContentWidth + (paddingX * 2);
                const cardHeight = calcStampSize + calcCatSize + calcDateSize + (paddingY * 2.2);

                const x = img.width - cardWidth - margin;
                const y = img.height - cardHeight - margin;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.roundRect(x, y, cardWidth, cardHeight, 12 * scaleFactor);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1.5 * scaleFactor;
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                const centerX = x + (cardWidth / 2);
                let currentY = y + paddingY;

                ctx.fillStyle = '#fbbf24';
                ctx.font = `800 ${calcStampSize}px Inter, sans-serif`;
                ctx.fillText(stampText, centerX, currentY);
                currentY += calcStampSize + (3 * scaleFactor);

                ctx.fillStyle = '#f4f4f5';
                ctx.font = `700 ${calcCatSize}px Inter, sans-serif`;
                ctx.fillText(categoryText, centerX, currentY);
                currentY += calcCatSize + (4 * scaleFactor);

                ctx.fillStyle = '#e4e4e7';
                ctx.font = `500 ${calcDateSize}px Inter, sans-serif`;
                ctx.fillText(timestampStr, centerX, currentY);

                const stampedDataUrl = photoCanvas.toDataURL('image/jpeg', 0.92);
                stampedImageResult.src = stampedDataUrl;
                previewModal.classList.remove('hidden');

                // Save natively to iOS Photo Gallery
                saveToGallery(stampedDataUrl);
            };
            img.src = dataUrl;
        }

        async function saveToGallery(base64Data) {
            try {
                const Filesystem = window.Capacitor?.Plugins?.Filesystem;
                if (!Filesystem) {
                    saveStatusText.textContent = "Saved Preview Only";
                    saveStatusText.className = "text-xs font-semibold uppercase tracking-wider text-amber-400";
                    return;
                }

                const fileName = `PMO-WLB_${Date.now()}.jpg`;
                const pureBase64 = base64Data.replace(/^data:image\/\w+;base64,/, "");

                await Filesystem.writeFile({
                    path: fileName,
                    data: pureBase64,
                    directory: 'DOCUMENTS'
                });

                saveStatusText.textContent = "Saved to Device";
                saveStatusText.className = "text-xs font-semibold uppercase tracking-wider text-emerald-400";
            } catch (e) {
                console.error("Save failed:", e);
                saveStatusText.textContent = "Save Failed";
                saveStatusText.className = "text-xs font-semibold uppercase tracking-wider text-rose-400";
            }
        }

        nativeCaptureBtn.addEventListener('click', takePhotoNative);
        retakeBtn.addEventListener('click', () => previewModal.classList.add('hidden'));

        styleSettingsBtn.addEventListener('click', () => {
            settingsDrawer.classList.remove('opacity-0', 'pointer-events-none');
            drawerContent.classList.remove('translate-y-full');
        });

        function closeSettings() {
            drawerContent.classList.add('translate-y-full');
            settingsDrawer.classList.add('opacity-0', 'pointer-events-none');
        }

        closeSettingsBtn.addEventListener('click', closeSettings);
        applySettingsBtn.addEventListener('click', closeSettings);

        stampTextInput.addEventListener('input', (e) => {
            stampText = e.target.value;
            updateUI();
        });

        categorySelect.addEventListener('change', (e) => {
            categoryText = e.target.value;
            updateUI();
        });

        window.addEventListener('load', () => {
            if (window.lucide) lucide.createIcons();
            updateUI();
        });
    </script>
</body>
</html>
